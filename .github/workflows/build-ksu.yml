name: Build KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            git \
            zip \
            unzip \
            curl \
            wget \
            ccache

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh" | bash -s dev

      - name: Build Kernel
        run: |
          make clean
          chmod +x build.sh
          ./build.sh

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Build-Artifacts
          path: AnyKernel/*.zip
          retention-days: 1
